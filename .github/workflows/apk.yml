name: APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write # to publish the APK in the « latest » release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Configuration du classement mondial (secrets facultatifs)
        run: node scripts/online-config.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      # Clé de signature personnelle (secrets du dépôt, jamais dans le code) :
      # RELEASE_KEYSTORE_B64 = le fichier .jks en base64, RELEASE_STORE_PASSWORD = son mot de passe.
      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::warning::Secrets RELEASE_KEYSTORE_B64 / RELEASE_STORE_PASSWORD absents : APK signé avec la clé de debug, pas publié."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/redless-release.jks"
          {
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/redless-release.jks"
            echo "RELEASE_KEY_ALIAS=redless"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
          } >> "$GITHUB_ENV"
      - run: android/build.sh
      # Même APK sous l'ancien nom : le bouton « Mettre à jour » des versions d'avant la 3.24
      # télécharge .../releases/download/latest/redless.apk.
      - run: cp dist/redlok.apk dist/redless.apk
      - uses: actions/upload-artifact@v4
        with:
          name: redlok-apk
          path: dist/redlok.apk
      # Fixed download link used by the « Mettre à jour » button of the Android app:
      # https://github.com/anonyme5575/redless/releases/download/latest/redlok.apk
      # Publié seulement s'il est signé avec la clé personnelle : un APK de debug ne pourrait pas
      # s'installer par-dessus chez les joueurs.
      - name: Publier l'APK (release « latest »)
        if: github.ref == 'refs/heads/main' && env.RELEASE_KEYSTORE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Redlok (dernière version)
          body: |
            Dernière version de Redlok pour Android. Télécharge redlok.apk et installe-le par-dessus l'ancien : ta progression est gardée.

            Tu avais installé Redlok avant octobre 2026 et Android affiche « Application non installée » ? Une seule fois : crée un compte dans le jeu (Réglages → Compte) pour garder ta progression, désinstalle l'ancienne Redlok, puis installe celle-ci.
          files: |
            dist/redlok.apk
            dist/redless.apk
          make_latest: true
